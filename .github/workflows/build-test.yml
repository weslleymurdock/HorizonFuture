name: Build & Test
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    types: [opened, synchronize, reopened]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up DotNet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.*'

      - name: Restore dependencies
        run: |
          dotnet workload restore
          dotnet tool restore
          dotnet restore

      - name: Build
        run: |
          dotnet build HorizonFuture.slnx --configuration Release --no-restore

      - name: Tests
        run: |
          dotnet test HorizonFuture.slnx --configuration Release --no-build --verbosity normal